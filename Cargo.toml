[package]
name = "repo-doctor"
version = "0.2.0"
edition = "2024"
description = "Explain unmet local setup requirements in Node.js and Python projects"
license = "MIT"
repository = "https://github.com/appdever01/repo-doctor"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
node-semver = "2.2"
pep440_rs = "0.7"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "net", "time", "signal", "sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
