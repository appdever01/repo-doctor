name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install tested Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Test
        run: cargo test --locked -- --test-threads=2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo build --locked --release
      - name: Verify source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/repo-doctor-install" --target-dir target -j 2
          "$RUNNER_TEMP/repo-doctor-install/bin/repo-doctor" --version
          "$RUNNER_TEMP/repo-doctor-install/bin/repo-doctor" check examples/demo-api --static --format json > "$RUNNER_TEMP/static-report.json" || test "$?" -eq 1
          "$RUNNER_TEMP/repo-doctor-install/bin/repo-doctor" check examples/startup-api --startup --strict --format json > "$RUNNER_TEMP/startup-report.json"
      - name: Package native build
        run: |
          sh scripts/package-release.sh "$RUNNER_TEMP/repo-doctor-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repo-doctor-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/repo-doctor-dist/*
          retention-days: 14
